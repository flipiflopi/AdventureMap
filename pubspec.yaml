name: adventure_map
description: A social map for adventure spots
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localización (Añadido)
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  flutter_keyboard_visibility: 5.4.1

  # Notificaciones
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.2.3

  # Autocompletar 
  http: ^1.1.0  

  # Tutorial
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  google_sign_in: ^6.1.5
  
  # Maps
  mapbox_maps_flutter: ^2.12.0
  google_maps_flutter: ^2.5.0
  map_launcher: ^3.0.1
  
  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  geotypes: ^0.0.2
  flutter_typeahead: ^4.8.0
  
  # Images
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  
  # UI
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  intl: ^0.19.0 # Actualizado para compatibilidad con i18n
  
  # 🆕 Share & Deep Links
  share_plus: ^7.2.1
  
  # Clustering
  google_maps_cluster_manager: ^3.0.0+1
  timeago: ^3.7.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 
  
flutter:
  generate: true # ACTIVADO para i18n
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# Configuración de icono de app
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"